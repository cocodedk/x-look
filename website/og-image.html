  html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:var(--fog); }

  .mark { display:flex; align-items:center; gap:14px; font:600 30px/1 var(--serif); color:var(--ink); }
  .mark svg { width:52px; height:52px; }
  h1 { font:500 68px/1.02 var(--serif); letter-spacing:-0.02em; margin:34px 0 22px; }
  .sub { font:400 27px/1.4 var(--serif); color:var(--quiet); margin:0; }
  .by { position:absolute; left:64px; bottom:34px; font:400 19px/1 var(--serif); color:var(--quiet); }
  .scheme { margin:0; filter: drop-shadow(0 18px 40px rgba(30,37,43,.10)); }
  .scheme svg { width:100%; }
</style>
