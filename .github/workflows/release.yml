name: Release

# Manual only. Never triggered by a push or by the v* tag this workflow pushes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # Release only from the default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Modes: new (bump and tag), recover (latest tag has no published release:
      # rebuild that tag, never bump again), verify (latest tag is this commit and
      # its release is published and complete: nothing to do).
      - name: Plan
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          # Prints none | draft | published, fails on any other gh error.
          release_state() {
            local out
            if out=$(gh release view "$1" --json isDraft --jq '.isDraft' 2>&1); then
              [ "$out" = true ] && echo draft || echo published
            elif grep -q 'release not found' <<<"$out"; then
              echo none
            else
              echo "$out" >&2; return 1
            fi
          }
          assets_complete() {
            local names
            names=$(gh release view "$1" --json assets --jq '.assets[].name')
            grep -qx 'x-look.zip' <<<"$names" && grep -qx "x-look-$1.zip" <<<"$names"
          }

          LATEST=$(scripts/version.sh latest)
          MODE=new
          if [ -n "$LATEST" ]; then
            STATE=$(release_state "$LATEST")
            if [ "$STATE" != published ]; then
              MODE=recover; TAG=$LATEST
            elif ! assets_complete "$LATEST"; then
              echo "::error::Published release $LATEST is missing assets; fix it by hand, it will not be overwritten."
              exit 1
            elif [ "$(git rev-parse "$LATEST^{commit}")" = "$(git rev-parse HEAD)" ]; then
              MODE=verify; TAG=$LATEST
            fi
          fi

          if [ "$MODE" = new ]; then
            TAG=$(scripts/version.sh next "$BUMP")
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
               || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists"; exit 1
            fi
            [ "$(release_state "$TAG")" = none ] || { echo "::error::A release for $TAG already exists without its tag"; exit 1; }
          fi

          echo "Mode: $MODE, tag: $TAG"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out the existing tag
        if: steps.plan.outputs.mode == 'recover'
        run: git checkout --detach "refs/tags/${{ steps.plan.outputs.tag }}"

      - name: Build and verify zip
        if: steps.plan.outputs.mode != 'verify'
        run: scripts/build.sh "${{ steps.plan.outputs.tag }}"

      - name: Attest build provenance
        if: steps.plan.outputs.mode != 'verify'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/x-look*.zip

      - name: Upload workflow artifact
        if: steps.plan.outputs.mode != 'verify'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: x-look-${{ steps.plan.outputs.tag }}
          path: dist/x-look*.zip

      - name: Tag and push
        if: steps.plan.outputs.mode == 'new'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Draft, upload, verify, publish
        if: steps.plan.outputs.mode != 'verify'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/x-look.zip "dist/x-look-$TAG.zip" --clobber
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG" \
              dist/x-look.zip "dist/x-look-$TAG.zip"
          fi
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          grep -qx 'x-look.zip' <<<"$names" && grep -qx "x-look-$TAG.zip" <<<"$names" \
            || { echo "::error::Draft $TAG is missing assets: $names"; exit 1; }
          gh release edit "$TAG" --draft=false --latest
