<!doctype html>
<!-- Source of the 9-second store video. render(t) draws the frame at t seconds;
     store/render-video.py steps it at 30 fps and encodes the frames. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Calm Reader for X video</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" />
<style>
  :root { --fog:#e9ecee; --paper:#f8f9f9; --ink:#1e252b; --quiet:#57626b; --rule:#d3d8dc; --ghost:#dde2e5; --signal:#f2c230; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--fog); font-family:"Newsreader", Georgia, serif; color:var(--ink); }
  .caption { position:absolute; left:0; right:0; top:70px; text-align:center; font:500 66px/1 "Newsreader", Georgia, serif; letter-spacing:-0.01em; }
  .frame { position:absolute; left:260px; top:190px; width:1400px; height:820px; border-radius:22px; background:#fff; box-shadow:0 24px 60px rgba(30,37,43,.12); overflow:hidden; }
  .dots { position:absolute; left:26px; top:20px; display:flex; gap:10px; }
  .dots i { width:12px; height:12px; border-radius:50%; background:var(--rule); }
  .side { position:absolute; top:60px; bottom:30px; border-radius:14px; border:2px dashed transparent; }
  .side .fill { position:absolute; inset:0; border-radius:12px; background:#eef1f3; padding:26px 22px; box-sizing:border-box; }
  .side .fill b { display:block; height:14px; border-radius:7px; background:#c9d0d5; margin-bottom:22px; }
  .nav { left:30px; width:230px; }
  .rail { right:30px; width:270px; }
  .col { position:absolute; left:420px; width:560px; top:60px; bottom:0; background:var(--paper); box-shadow:0 0 0 1px var(--rule); padding:0 34px; box-sizing:border-box; }
  .post { overflow:hidden; border-bottom:1px solid var(--rule); position:relative; }
  .post .body { padding:28px 0 26px; display:flex; gap:18px; }
  .post .av { width:46px; height:46px; border-radius:50%; background:#c9d0d5; flex:none; }
  .post .lines { flex:1; }
  .post .lines b { display:block; height:11px; border-radius:6px; background:#cfd5da; margin-bottom:14px; }
  .post .lines b.name { width:34%; height:13px; background:#9aa5ad; }
  .post .hidden { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:400 18px/1 system-ui, sans-serif; color:#9aa5ad; opacity:0; }
  .tile { position:relative; height:190px; border-radius:16px; margin-top:6px; overflow:hidden; background:#e1e5e8; }
  .tile .img { position:absolute; inset:0; background:linear-gradient(135deg,#f2c230 0%,#ef7b45 40%,#7b5ea7 75%,#2b6cb0 100%); }
  .tile .eye { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:10px; font:500 20px/1 system-ui, sans-serif; color:#6b767e; }
  .tile .eye svg { width:30px; height:30px; fill:currentColor; }
  .filter { position:absolute; left:52px; top:96px; width:300px; }
  .filter .pill { border:2px solid #1d9bf0; border-radius:999px; padding:14px 22px; font:400 26px/1.2 system-ui, sans-serif; color:#555; background:#fff; min-height:32px; }
  .filter .count { padding:10px 24px 0; font:400 20px/1 system-ui, sans-serif; color:#767676; }
  .cursor { position:absolute; width:44px; height:44px; }
  .ripple { position:absolute; width:80px; height:80px; margin:-40px 0 0 -40px; border-radius:50%; border:4px solid #1d9bf0; opacity:0; }
  .end { position:absolute; inset:0; background:var(--fog); display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; }
  .end .mark { display:flex; align-items:center; gap:34px; font:600 104px/1 "Newsreader", Georgia, serif; letter-spacing:-0.02em; }
  .end .mark img { width:150px; height:150px; }
  .end p { margin:44px 0 0; font:400 42px/1.3 "Newsreader", Georgia, serif; color:var(--quiet); }
  .end .url { margin-top:22px; font-size:34px; color:var(--ink); }
</style>
</head>
<body>
<div class="caption" id="cap"></div>
<div class="frame">
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="side nav" id="nav"><div class="fill"><b style="width:70%"></b><b style="width:55%"></b><b style="width:64%"></b><b style="width:48%"></b><b style="width:60%"></b><b style="width:52%"></b></div></div>
  <div class="side rail" id="rail"><div class="fill"><b style="width:90%;height:40px;border-radius:20px"></b><b style="width:100%;height:120px;border-radius:12px"></b><b style="width:80%"></b><b style="width:70%"></b><b style="width:85%"></b><b style="width:100%;height:120px;border-radius:12px"></b></div></div>
  <div class="col">
    <div class="post" id="pa"><div class="body"><div class="av"></div><div class="lines"><b class="name"></b><b style="width:95%"></b><b style="width:72%"></b>
      <div class="tile"><div class="img" id="img"></div><div class="eye" id="eye"><svg viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 9.3 1.5 12c1.2 2.7 5.5 7 10.5 7s9.3-4.3 10.5-7C21.3 9.3 17 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>Image</div></div></div></div></div>
    <div class="post" id="pb"><div class="body"><div class="av"></div><div class="lines"><b class="name"></b><b style="width:92%"></b><b style="width:88%"></b><b style="width:60%"></b></div></div><div class="hidden">hidden by filter</div></div>
    <div class="post" id="pc"><div class="body"><div class="av"></div><div class="lines"><b class="name"></b><b style="width:90%"></b><b style="width:70%"></b></div></div><div class="hidden">hidden by filter</div></div>
  </div>
  <div class="filter" id="filter"><div class="pill" id="typed"></div><div class="count" id="count"></div></div>
</div>
<svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M5 2l14 10-6.5 1.4L16 21l-3 1.4-3.6-7.6L5 19z" fill="#1e252b" stroke="#fff" stroke-width="1.4"/></svg>
<div class="ripple" id="ripple"></div>
<div class="end" id="end">
  <div class="mark"><img src="../icons/icon128.png" alt="" />Calm Reader for X</div>
  <p>One calm column on x.com. Free, open source, collects nothing.</p>
  <p class="url">xlook.cocode.dk</p>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const ease = (x) => x * x * (3 - 2 * x);
  const ramp = (t, a, b) => ease(clamp((t - a) / (b - a)));
  const CAPTIONS = [
    [0, 1.7, "x.com, as it is"],
    [1.7, 3.5, "Calm Reader for X clears the noise"],
    [3.5, 5.5, "Pictures wait until you click"],
    [5.5, 7.5, "Keep only the posts you want"],
  ];
  const WORD = "design";
  const POST_H = {};

  window.render = (t) => {
    const cap = CAPTIONS.find(([a, b]) => t >= a && t < b) || CAPTIONS[CAPTIONS.length - 1];
    $("cap").textContent = cap[2];
    $("cap").style.opacity = Math.min(ramp(t, cap[0], cap[0] + 0.3), 1 - ramp(t, cap[1] - 0.25, cap[1]));

    // Scene 2: the nav and the rail empty out to dashed outlines.
    const calm = ramp(t, 1.8, 2.6);
    for (const id of ["nav", "rail"]) {
      $(id).querySelector(".fill").style.opacity = 1 - calm;
      $(id).style.borderColor = `rgba(154,165,173,${calm})`;
    }
    // The picture greys out, then comes back when clicked in scene 3.
    $("img").style.opacity = 1 - ramp(t, 2.6, 3.1) + ramp(t, 4.55, 4.95);
    $("eye").style.opacity = ramp(t, 2.6, 3.1) - ramp(t, 4.5, 4.7);

    // Scene 3: the cursor moves onto the tile and clicks.
    const move = ramp(t, 3.7, 4.35);
    const cx = 1500 + (980 - 1500) * move, cy = 960 + (560 - 960) * move;
    $("cursor").style.transform = `translate(${cx}px, ${cy}px)`;
    $("cursor").style.opacity = ramp(t, 3.55, 3.75) - ramp(t, 5.0, 5.3);
    const pulse = clamp((t - 4.4) / 0.45);
    $("ripple").style.left = `${cx + 6}px`;
    $("ripple").style.top = `${cy + 6}px`;
    $("ripple").style.opacity = pulse > 0 && pulse < 1 ? 1 - pulse : 0;
    $("ripple").style.transform = `scale(${0.4 + pulse})`;

    // Scene 4: the filter box types a word, the other posts fold away.
    $("filter").style.opacity = ramp(t, 5.5, 5.8) - ramp(t, 7.5, 7.7);
    const letters = Math.floor(clamp((t - 5.9) / 0.8) * WORD.length);
    $("typed").textContent = WORD.slice(0, letters);
    const fold = ramp(t, 6.8, 7.2);
    $("count").textContent = fold > 0.5 ? "2 hidden" : "";
    for (const id of ["pb", "pc"]) {
      const post = $(id);
      POST_H[id] ??= post.offsetHeight;
      post.style.height = `${POST_H[id] + (40 - POST_H[id]) * fold}px`;
      post.querySelector(".body").style.opacity = 1 - fold;
      post.querySelector(".hidden").style.opacity = fold;
    }

    // Scene 5: the end card.
    $("end").style.opacity = ramp(t, 7.5, 7.95);
  };
  window.render(0);
</script>
</body>
</html>
