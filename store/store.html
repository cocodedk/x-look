<!doctype html>

     #promo the 440x280 small promo tile. Rendered by store/render.py. -->

<style>
  :root { color-scheme: light; --fog:#e9ecee; --paper:#f8f9f9; --ink:#1e252b; --quiet:#57626b; --rule:#d3d8dc; --ghost:#dde2e5; }
  html, body { margin:0; overflow:hidden; background:var(--fog); }
  .mark { display:flex; align-items:center; gap:14px; font:600 30px/1 var(--serif); color:var(--ink); }
  .scheme { margin:0; filter: drop-shadow(0 18px 40px rgba(30,37,43,.10)); }
  .scheme svg { width:100%; }
  #shot, #promo { display:none; box-sizing:border-box; }
  body.shot #shot { display:grid; width:1280px; height:800px; grid-template-columns:440px 1fr; gap:56px; align-items:center; padding:0 72px; }
  body.promo #promo { display:flex; width:440px; height:280px; flex-direction:column; justify-content:center; padding:0 36px; }
  #shot .mark svg { width:52px; height:52px; }
  #shot h1 { font:500 64px/1.04 var(--serif); letter-spacing:-0.02em; margin:34px 0 22px; }
  #shot .sub { font:400 26px/1.45 var(--serif); color:var(--quiet); margin:0; }
  #promo .mark { font-size:28px; }
  #promo .mark svg { width:46px; height:46px; }
  #promo .sub { font:400 20px/1.35 var(--serif); color:var(--quiet); margin:18px 0 0; }
</style>
</head>
